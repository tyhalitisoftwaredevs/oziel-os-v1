spring.application.name=oziel-os
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:oziel;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true
jwt.secret=${JWT_SECRET:oziel-os-local-development-secret-change-before-production-2026}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
admin.email=${ADMIN_EMAIL:admin@ozielos.co.za}
admin.password=${ADMIN_PASSWORD:admin123}
profile.projects-shipped=${PROFILE_PROJECTS_SHIPPED:5}
profile.total-certificates=${PROFILE_TOTAL_CERTIFICATES:12}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
notifications.email.to=${NOTIFICATIONS_EMAIL_TO:}
notifications.email.from=${NOTIFICATIONS_EMAIL_FROM:}
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:true}
notifications.sms.to=${NOTIFICATIONS_SMS_TO:}
notifications.sms.enabled=${NOTIFICATIONS_SMS_ENABLED:false}
notifications.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
notifications.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
notifications.twilio.from=${TWILIO_FROM_NUMBER:}
notifications.poll-interval-ms=${NOTIFICATIONS_POLL_INTERVAL_MS:5000}
notifications.max-attempts=${NOTIFICATIONS_MAX_ATTEMPTS:8}
springdoc.swagger-ui.path=/swagger-ui.html
